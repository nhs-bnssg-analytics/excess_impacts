version: '3.7'
services:
  estimate:
    build:
      context: .
      dockerfile: Dockerfile_icb
    working_dir: /root/
    environment:
      - DB_HOST
      - DB_NAME
      - DB_USER
      - DB_CRED
    volumes:
      - /samba/nowcast-data/xsi/data:/root/data
      - /home/rshiny:/root/sql
    restart: always
